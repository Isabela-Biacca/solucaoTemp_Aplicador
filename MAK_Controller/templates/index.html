<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solução Temporária Aplicador LPN</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      /* CORPO */
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        height: max-content;
      }

      /* HEADER */
      header {
        text-align: center;
        background-color: #0051b4;
        color: white;
        padding: 1.5%;
        display: flex;
        flex-wrap: wrap; /* Allow items to wrap onto a new line if needed */
        justify-content: space-between; /* Space out items evenly */
        align-items: center; /* Align items vertically centered */
      }

      header img {
        max-width: 100%; /* Make the logo responsive */
        height: auto; /* Maintain the aspect ratio */
      }

      header h1 {
        margin: 0;
        padding: 15px; /* Reduced padding for smaller screens */
        font-size: 2em; /* Responsive font size */
        color: #000000;
      }

      header button {
        padding: 10px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin: 10px 0;
        max-width: 100%; /* Limite de largura */
        box-sizing: border-box; /* Inclui padding e bordas na largura total */
        overflow: hidden; /* Oculta o excesso de texto */
        text-overflow: ellipsis; /* Adiciona "..." se o texto for muito longo */
        white-space: nowrap; /* Evita quebras de linha */
      }

      @media (max-width: 600px) {
        header {
          flex-direction: column; /* Stack items vertically */
          align-items: center; /* Center items */
        }

        header h1 {
          font-size: 1.2em; /* Decrease font size */
        }

        header button {
          width: 100%; /* Make the button full width on smaller screens */
        }
      }

      /* INPUT */
      .input-section {
        text-align: center;
        margin: 20px 0;
      }

      .input-section input {
        padding: 10px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .input-section button {
        padding: 10px 20px;
        background-color: #0051b4;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        margin-top: 10px;
      }

      /* BOX KANBAN */
      .status-box {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .status {
        width: 30%;
        background-color: #f7f9fc;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px;
      }

      .status h2 {
        text-align: center;
        background-color: #0051b4;
        color: white;
        margin-top: 0;
        padding: 10px 0;
        border-radius: 4px;
      }

      .status table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      .status th,
      .status td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }

      .status th {
        background-color: #0051b4;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="../static/logo.png"
          alt="Infra ID Logo"
          class="logo"
          width="150"
          height="90"
        />
        <h1>SOLUÇÃO TEMPORÁRIA APLICADOR LPN</h1>

        <div
          class="alert-container"
          style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            max-width: 400px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
          "
        >
          <h3 style="margin-top: 0; color: #856404">⚠️ Ações Pendentes</h3>
          <div id="alertList"></div>
        </div>

        <button
          style="
            color: white;
            background-color: black;
            padding: 10px;
            width: 5vw;
            height: 6vh;
          "
          onclick="redirecionar()"
        >
          LOG
        </button>
      </header>
      <br /><br />

      <div class="input-section">
        <label for="codigo">Insira o código da ordem de produção</label>
        <br /><br />
        <input type="text" id="orderInput" placeholder="Número da Ordem" />
        <button onclick="moveOrder()">Enviar</button>
      </div>

      <br />

      <div class="status-box">
        <div class="status">
          <h2>BW</h2>

          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="bw-table"></tbody>
          </table>
        </div>

        <div class="status">
          <h2>PC</h2>
          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="pc-table"></tbody>
          </table>
        </div>

        <div class="status">
          <h2>HC</h2>

          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="hc-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      function redirecionar() {
        window.location.href = "/logs"; // Substitua pela URL desejada
      }

      async function loadOrders() {
        const response = await fetch("/api/orders");
        const data = await response.json();

        bw = [];
        pc = [];
        hc = [];

        data.input.forEach((order) => {
          if (order.linha.startsWith("S")) {
            bw.push(order);
          } else if (order.linha.startsWith("D")) {
            pc.push(order);
          } else if (order.linha.startsWith("A")) {
            hc.push(order);
          }
        });

        document.getElementById("bw-table").innerHTML =
          bw.length > 0
            ? bw
                .map((order) => {
                  // Verifica se a linha começa com "S"
                  if (order.linha.startsWith("S")) {
                    return `
                <tr>
                  <td>${order.linha}</td>
                  <td>${order.op}</td>
                  <td>${order.sku}</td>
                </tr>
              `;
                  }
                })
                .join("")
            : `
          <tr>
            <td colspan="3">Nenhuma Ordem em produção no momento</td>
          </tr>
        `;

        document.getElementById("pc-table").innerHTML =
          pc.length > 0
            ? pc
                .map((order) => {
                  // Verifica se a linha começa com "D"
                  if (order.linha.startsWith("D")) {
                    return `
                <tr>
                  <td>${order.linha}</td>
                  <td>${order.op}</td>
                  <td>${order.sku}</td>
                </tr>
              `;
                  }
                })
                .join("")
            : `
          <tr>
            <td colspan="3">Nenhuma Ordem em produção no momento</td>
          </tr>
        `;

        document.getElementById("hc-table").innerHTML =
          hc.length > 0
            ? hc
                .map((order) => {
                  // Verifica se a linha começa com "A
                  if (order.linha.startsWith("A")) {
                    return `
                <tr>
                  <td>${order.linha}</td>
                  <td>${order.op}</td>
                  <td>${order.sku}</td>
                </tr>
              `;
                  }
                })
                .join("")
            : `
          <tr>
            <td colspan="3">Nenhuma Ordem em produção no momento</td>
          </tr>
        `;
      }

      async function moveOrder() {
        const orderId = document.getElementById("orderInput").value;
        const response = await fetch(`/move/${orderId}`);
        alert(await response.text());
        loadOrders(); // Atualiza a lista após mover
      }

      // Atualizar alertas a cada 30 segundos
      function updateAlerts() {
        fetch("/api/pending_actions")
          .then((response) => response.json())
          .then((data) => {
            const container = document.querySelector(".alert-container");
            const list = document.getElementById("alertList");

            if (data.alerts && data.alerts.length > 0) {
              container.style.display = "block";
              list.innerHTML = data.alerts
                .map(
                  (alert) =>
                    `<div style="margin: 10px 0; padding: 10px; background: white; border-radius: 3px;">
                        ${alert}
                    </div>`
                )
                .join("");
            } else {
              container.style.display = "none";
            }
          });
      }

      setInterval(updateAlerts, 30000);
      updateAlerts(); // Carrega inicialmente

      setInterval(loadOrders, 5000); // Atualiza a cada 5 segundos
      loadOrders();
    </script>
  </body>
</html>
