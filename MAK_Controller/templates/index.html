<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solução Temporária Aplicador LPN</title>
    <link rel="stylesheet" href="../static/css/index.css" />
    <script src="../static/js/index.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header>
        <img
          src="../static/img/logo.png"
          alt="Infra ID Logo"
          class="logo"
          width="150"
          height="90"
        />
        <h1>SOLUÇÃO TEMPORÁRIA APLICADOR LPN</h1>

        <div
          class="alert-container"
          style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            max-width: 400px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
          "
        >
          <h3 style="margin-top: 0; color: #856404">⚠️ Ações Pendentes</h3>
          <div id="alertList"></div>
        </div>

        <button
          style="
            color: white;
            background-color: black;
            padding: 10px;
            width: 5vw;
            height: 6vh;
          "
          onclick="window.location.href = '/logs'"
        >
          LOG
        </button>
      </header>
      <br /><br />

      <div class="input-section">
        <label for="codigo">Insira o código da ordem de produção</label>
        <br /><br />
        <input type="text" id="orderInput" placeholder="Número da Ordem" />
        <button onclick="moveOrder()">Enviar</button>
      </div>

      <br />

      <div class="status-box">
        <div class="status">
          <h2>BW</h2>

          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="bw-table"></tbody>
          </table>
        </div>

        <div class="status">
          <h2>PC</h2>
          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="pc-table"></tbody>
          </table>
        </div>

        <div class="status">
          <h2>HC</h2>

          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Ordem em Produção</th>
                <th>SKU</th>
              </tr>
            </thead>
            <tbody id="hc-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
