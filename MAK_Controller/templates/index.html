<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solução Temporária Aplicador LPN</title>
  <link rel="stylesheet" href="../static/css/index.css" />
  <script src="../static/js/index.js" defer></script>
</head>

<body>
  <div class="container">
    <header>
      <img src="../static/img/logo-completa-preto-semfundo.png" alt="Infra ID Logo" class="logo" width="150"
        height="90" />
      <h1>SOLUÇÃO TEMPORÁRIA APLICADOR LPN</h1>
      <div>
        <button onclick="window.location.href = '/rastreadorLPN'">
          RASTREADOR LPN
        </button>
        <button onclick="window.location.href = '/logs'">
          LOG
        </button>
      </div>
    </header>
    <br /><br />

    <div id="notification" style="
          position: fixed;
          top: 120px;
          left: 50%;
          transform: translateX(-50%);
          background: #ffd700;
          padding: 15px 40px 15px 20px;
          border-radius: 5px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
          display: none;
          z-index: 1000;
          max-width: 80%;
          text-align: center;
        ">
      <span id="notification-text"></span>
      <button onclick="closeNotification()" style="
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            cursor: pointer;
            color: #856404;
            font-weight: bold;
          ">
        ✕
      </button>
    </div>

    <div class="input-section">
      <label for="codigo">Insira o código da ordem de produção</label>
      <br /><br />
      <input type="text" id="orderInput" placeholder="Número da Ordem" />
      <button onclick="moveOrderAndClear()">Enviar</button>
    </div>

    <br />

    <div class="status-box">
      <div class="status">
        <h2>BW</h2>

        <table>
          <thead>
            <tr>
              <th>Linha</th>
              <th>Ordem em Produção</th>
              <th>SKU</th>
              <th>Iniciada em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="bw-table"></tbody>
        </table>
      </div>

      <div class="status">
        <h2>PC</h2>
        <table>
          <thead>
            <tr>
              <th>Linha</th>
              <th>Ordem em Produção</th>
              <th>SKU</th>
              <th>Iniciada em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="pc-table"></tbody>
        </table>
      </div>

      <div class="status">
        <h2>HC</h2>

        <table>
          <thead>
            <tr>
              <th>Linha</th>
              <th>Ordem em Produção</th>
              <th>SKU</th>
              <th>Iniciada em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="hc-table"></tbody>
        </table>
      </div>
    </div>

    <div class="input-section">
      <label for="codigo">Recuperar ordem encerrada</label>
      <br><br>
      <input type="text" id="recoverInput" placeholder="Número da Ordem">
      <button onclick="recoverOrderAndClear()">Recuperar</button>
    </div>
  </div>
</body>

</html>
